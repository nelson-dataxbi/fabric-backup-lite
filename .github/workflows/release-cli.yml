name: Release fbl CLI

on:
  push:
    tags:
      - "v*-cli"          # e.g. v0.1.0-cli, v1.0.0-cli
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-cli)"
        required: true

jobs:
  release:
    name: Build and release fbl.exe
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for MinVer

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish fbl.exe (self-contained, single file)
        run: |
          dotnet publish src/Fabric_backup_lite.Cli/Fabric_backup_lite.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/cli

      - name: Package as zip
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Compress-Archive -Path dist/cli/fbl.exe -DestinationPath "dist/fbl-$tag-win-x64.zip"

      - name: Get release tag
        id: tag
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "value=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "fbl CLI ${{ steps.tag.outputs.value }}"
          body: |
            ## fbl — Fabric Backup Lite CLI

            ### Instalación / Installation

            **Descarga `fbl-${{ steps.tag.outputs.value }}-win-x64.zip` y extrae con PowerShell** (importante: usar PowerShell, no el Explorador de Windows):

            ```powershell
            # Extraer (reemplaza la ruta según donde descargaste el zip)
            Expand-Archive fbl-${{ steps.tag.outputs.value }}-win-x64.zip -DestinationPath C:\Tools\fbl

            # Agregar al PATH (opcional, ejecutar una sola vez)
            [Environment]::SetEnvironmentVariable("PATH", $env:PATH + ";C:\Tools\fbl", "User")
            ```

            > Si extraes con el Explorador de Windows, Windows puede mostrar una alerta al ejecutar `fbl.exe`. Para ignorarla: **"Más información" → "Ejecutar de todas formas"**. El código fuente es público en este repositorio.

            ---

            **Download `fbl-${{ steps.tag.outputs.value }}-win-x64.zip` and extract with PowerShell** (important: use PowerShell, not Windows Explorer):

            ```powershell
            Expand-Archive fbl-${{ steps.tag.outputs.value }}-win-x64.zip -DestinationPath C:\Tools\fbl
            [Environment]::SetEnvironmentVariable("PATH", $env:PATH + ";C:\Tools\fbl", "User")
            ```

            > If you extract with Windows Explorer, Windows may show a security warning. To bypass it: click **"More info" → "Run anyway"**. Full source code is available in this repository.

            ---

            **Uso rápido / Quick start:**
            ```powershell
            az login
            fbl list workspaces
            fbl backup --workspace MiWorkspace --dest backups/
            fbl restore --root backups/ --backup latest --workspace MiWorkspace
            ```

            Consulta el [README del CLI](https://github.com/nelson-dataxbi/fabric-backup-lite/blob/feature/cli/src/Fabric_backup_lite.Cli/README.md) para la guía completa.
          files: dist/fbl-${{ steps.tag.outputs.value }}-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
