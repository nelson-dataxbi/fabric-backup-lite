name: Release fbl CLI

on:
  push:
    tags:
      - "v*-cli"          # e.g. v0.1.0-cli, v1.0.0-cli
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-cli)"
        required: true

jobs:
  release:
    name: Build and release fbl.exe
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for MinVer

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish fbl.exe (self-contained, single file)
        run: |
          dotnet publish src/Fabric_backup_lite.Cli/Fabric_backup_lite.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/cli

      - name: Get release tag
        id: tag
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "value=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "fbl CLI ${{ steps.tag.outputs.value }}"
          body: |
            ## fbl — Fabric Backup Lite CLI

            ### Instalación / Installation

            1. Descarga `fbl.exe` y colócalo en una carpeta (ej. `C:\Tools\fbl\`)
            2. Ejecuta en PowerShell para desbloquear y agregar al PATH:

            ```powershell
            # Desbloquear el exe (elimina la alerta de SmartScreen)
            Unblock-File .\fbl.exe

            # Agregar al PATH (ejecutar una sola vez, ajusta la ruta)
            [Environment]::SetEnvironmentVariable("PATH", $env:PATH + ";C:\Tools\fbl", "User")
            ```

            ---

            1. Download `fbl.exe` and place it in a folder (e.g. `C:\Tools\fbl\`)
            2. Run in PowerShell to unblock and add to PATH:

            ```powershell
            # Unblock the exe (removes SmartScreen warning)
            Unblock-File .\fbl.exe

            # Add to PATH (run once, adjust path as needed)
            [Environment]::SetEnvironmentVariable("PATH", $env:PATH + ";C:\Tools\fbl", "User")
            ```

            ---

            **Uso rápido / Quick start:**
            ```powershell
            az login
            fbl list workspaces
            fbl backup --workspace MiWorkspace --dest backups/
            fbl restore --root backups/ --backup latest --workspace MiWorkspace
            ```

            Consulta el [README del CLI](https://github.com/nelson-dataxbi/fabric-backup-lite/blob/feature/cli/src/Fabric_backup_lite.Cli/README.md) para la guía completa.
          files: dist/cli/fbl.exe
          generate_release_notes: true
          draft: false
          prerelease: false
